name: Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      bump:
        description: auto releases only if the commits need it. patch, minor and major always release.
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      dry-run:
        description: Only report the release that would be made.
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    uses: sublimelsp/lsp_release_workflow/.github/workflows/release.yml@v1
    with:
      bump: ${{ inputs.bump || 'auto' }}
      dry-run: ${{ inputs.dry-run == true }}
  # The release is created with GITHUB_TOKEN, which doesn't trigger other workflows, so the artifacts are built and
  # uploaded here.
  build:
    needs: release
    if: ${{ needs.release.outputs.tag }}
    uses: ./.github/workflows/build.yml
  push:
    name: Push artifacts
    needs: [release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          path: artifacts
      - name: Upload artifacts to release
        run: |
          find artifacts -mindepth 1 -maxdepth 1 -type d | while read dir; do
            platform_key=$(basename "$dir")
            archive="LSP-file-watcher-rust_${platform_key}.zip"
            git archive --format=zip HEAD > "$archive"
            binary=$(find "$dir" -name 'rust-watcher*' | head -1)
            if [ -n "$binary" ]; then
              chmod +x "$binary"
              zip -j "$archive" "$binary"
            fi
            gh release upload "$TAG" "$archive" --clobber --repo "${{ github.repository }}"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
  notify:
    name: Notify LSP packages registry
    needs: [release, push]
    runs-on: ubuntu-latest
    steps:
      - name: Build event payload
        id: payload
        run: |
          {
            echo 'json<<EOF'
            gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq '{
              release: {tag_name, published_at, body, assets_url},
              repository: {
                name: ${{ toJSON(github.event.repository.name) }},
                html_url: ${{ toJSON(github.event.repository.html_url) }}
              }
            }'
            echo EOF
          } >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
      - name: Dispatch lsp-add-or-update-package event
        uses: peter-evans/repository-dispatch@v4.0.1
        with:
          token: ${{ secrets.LSP_UTILS_REPOSITORY_DISPATCH_TOKEN }}
          repository: sublimelsp/repository
          event-type: lsp-add-or-update-package
          client-payload: ${{ steps.payload.outputs.json }}
